name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - name: Check out dsh-trace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        run: npm install --global pnpm@11.7.0

      - name: Install dsh-trace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dsh-trace
        run: pnpm run check
